:root{
 --font:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
 --ink:#14201a;--ink2:#34433b;--muted:#55645c;
 --paper:#eef2ef;--surface:#fff;--line:#d3dbd6;--line2:#e5eae7;
 --green:#14573f;--green-d:#0c3d2c;--green-l:#dcece4;
 --amber:#8a5200;--amber-l:#fbeed2;
 --brick:#a1352c;--brick-l:#f8e3e0;
 --slate:#22343f;--slate-d:#16232b;--slate-l:#e1e8ec;
 --accent:var(--green);--accent-d:var(--green-d);--accent-l:var(--green-l);
 --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;--s8:80px;
 --r:8px;--r2:12px;
}
body.admin{--accent:var(--slate);--accent-d:var(--slate-d);--accent-l:var(--slate-l)}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;font:400 15px/1.55 var(--font);color:var(--ink);background:var(--paper);font-variant-numeric:tabular-nums}
h1,h2,h3,p,dl,dd,ol,ul,fieldset{margin:0;padding:0}
h1,h2,h3{line-height:1.2;font-weight:700;letter-spacing:-.012em}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.wrap{width:100%;max-width:1120px;margin:0 auto;padding:0 var(--s5)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);height:44px;padding:0 var(--s5);border-radius:var(--r);border:1px solid transparent;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-d)}
.btn-line{background:var(--surface);border-color:#b4beb8;color:var(--ink)}
.btn-line:hover{border-color:var(--ink2)}
.btn-danger{background:var(--surface);border-color:#d8a7a2;color:var(--brick)}
.btn-danger:hover{background:var(--brick-l)}
.btn-sm{height:36px;padding:0 var(--s4);font-size:14px}
.btn-lg{height:52px;padding:0 var(--s6);font-size:16px}
.btn-block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border:0;background:transparent;border-radius:var(--r);cursor:pointer}

/* forms */
.field{margin-bottom:var(--s4)}
.field label,.field legend{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.field .hint{display:block;font-size:13px;color:var(--muted);margin-top:4px}
.field input,.field select{width:100%;height:44px;padding:0 var(--s3);border:1px solid #aeb9b2;border-radius:var(--r);background:#fff;font-size:15px}
.field input:focus,.field select:focus{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:0}
.field input[readonly]{background:var(--line2);color:var(--muted)}
.field.bad input,.field.bad select{border-color:var(--brick)}
.field .err{display:block;color:var(--brick);font-size:13px;margin-top:4px;font-weight:500}
.err-line{color:var(--brick);font-weight:500;margin:0 0 var(--s4);min-height:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 var(--s4)}

/* tags and notes */
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:2px 10px 2px 8px;border-radius:99px;background:var(--line2);color:var(--ink2);white-space:nowrap}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.tag.ok{background:var(--green-l);color:var(--green)}
.tag.wait{background:var(--amber-l);color:var(--amber)}
.tag.bad{background:var(--brick-l);color:var(--brick)}
.tag.go{background:var(--green);color:#fff}
.note{border-left:3px solid var(--green);background:var(--green-l);padding:var(--s3) var(--s4);border-radius:0 var(--r) var(--r) 0;margin:var(--s4) 0;color:#173f2f}
.note.warn{border-color:var(--amber);background:var(--amber-l);color:#5e3800}
.note.bad{border-color:var(--brick);background:var(--brick-l);color:#6d1f19}
.note.info{border-color:var(--slate);background:var(--slate-l);color:var(--slate-d)}

/* tables */
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{text-align:left;font-weight:600;font-size:13px;color:var(--muted);padding:var(--s2) var(--s3);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:var(--s3);border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:#f7faf8}
.tbl .sub{display:block;font-size:13px;color:var(--muted)}
.tbl a.who{font-weight:600;color:var(--ink);text-decoration:none}
.tbl a.who:hover{text-decoration:underline}
.empty{padding:var(--s6) var(--s4);text-align:center;color:var(--muted)}

/* ---------- public site ---------- */
body.site{background:var(--paper)}
.sh{border-bottom:1px solid var(--line);background:var(--paper)}
.sh-in{display:flex;align-items:center;justify-content:space-between;height:72px;gap:var(--s5)}
.brand{display:inline-flex;align-items:center;gap:var(--s3);text-decoration:none;color:var(--ink);font-weight:700;font-size:18px;letter-spacing:-.01em}
.brand .mk{width:34px;height:34px;border-radius:8px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;letter-spacing:0}
.brand-t{display:flex;flex-direction:column;line-height:1.1}
.brand-t small{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0}
.sh-nav{display:flex;gap:var(--s5)}
.sh-nav a{color:var(--ink2);text-decoration:none;font-weight:500}
.sh-nav a:hover{color:var(--green);text-decoration:underline}
.sh-act{display:flex;gap:var(--s3);align-items:center}
.hero{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:var(--s7);align-items:start;padding-top:var(--s8);padding-bottom:var(--s8)}
.hero h1{font-size:clamp(2.3rem,5.2vw,3.7rem);line-height:1.04;letter-spacing:-.03em;max-width:15ch}
.lead{font-size:18px;line-height:1.6;color:var(--ink2);max-width:58ch;margin:var(--s5) 0 var(--s6)}
.cta{display:flex;flex-wrap:wrap;gap:var(--s3)}
.fine{color:var(--muted);font-size:14px;margin-top:var(--s4)}
.hero-k{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:var(--s5)}
.hero-k h2{font-size:18px;margin-bottom:var(--s2)}
.hero-k dl>div{display:grid;grid-template-columns:112px 1fr;gap:var(--s4);padding:var(--s3) 0;border-top:1px solid var(--line2)}
.hero-k dl>div:first-child{border-top:0}
.hero-k dt{color:var(--muted)}
.hero-k dd{font-weight:600}
.band{background:var(--surface);border-block:1px solid var(--line)}
.sec{padding-top:var(--s8);padding-bottom:var(--s8)}
.two{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,7fr);gap:var(--s7);align-items:start}
.two h2,.sec>h2{font-size:clamp(1.6rem,3vw,2.15rem);letter-spacing:-.02em}
.two .intro{position:sticky;top:var(--s6)}
.two .intro p{color:var(--ink2);margin-top:var(--s3);max-width:40ch}
.how{list-style:none;counter-reset:h}
.how li{counter-increment:h;display:grid;grid-template-columns:56px 1fr;gap:var(--s4);padding:var(--s5) 0;border-top:1px solid var(--line)}
.how li:first-child{border-top:0;padding-top:0}
.how li::before{content:counter(h);font-size:30px;font-weight:700;color:var(--green);line-height:1}
.how h3{font-size:18px;margin-bottom:var(--s1)}
.how p{color:var(--ink2);max-width:56ch}
.sec .tbl{margin-top:var(--s5);background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.sec .tbl td,.sec .tbl th{padding:var(--s4) var(--s5)}
.sec .tbl td:first-child{font-weight:600;width:38%}
.faq{margin-top:var(--s5);max-width:760px}
.faq details{border-top:1px solid var(--line)}
.faq details:last-child{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:var(--s4);padding:var(--s4) 0;font-weight:600;font-size:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"";flex:none;width:9px;height:9px;border-right:2px solid var(--ink2);border-bottom:2px solid var(--ink2);transform:rotate(45deg);transition:transform .2s;margin-top:-4px}
.faq details[open] summary::after{transform:rotate(-135deg);margin-top:4px}
.faq p{padding:0 0 var(--s4);color:var(--ink2);max-width:62ch}
.foot{background:var(--green-d);color:#d3e3da;padding:var(--s7) 0}
.foot-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s6)}
.foot a{color:#fff}
.foot h2{color:#fff;font-size:17px;margin-bottom:var(--s2)}
.foot .copy{grid-column:1/-1;border-top:1px solid #2c5a47;padding-top:var(--s4);font-size:14px;color:#a9c4b6}

/* ---------- sign in and register ---------- */
.auth{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);min-height:100vh}
.auth-a{background:var(--green-d);color:#d9e8e0;padding:var(--s6) var(--s7);display:flex;flex-direction:column;justify-content:space-between;gap:var(--s6)}
.auth-a .brand{color:#fff}
.auth-a .brand .mk{background:#fff;color:var(--green-d)}
.auth-a .brand-t small{color:#a9c4b6}
.auth-a h2{color:#fff;font-size:clamp(1.6rem,2.6vw,2.2rem);line-height:1.18;max-width:17ch;letter-spacing:-.02em}
.auth-a p{margin-top:var(--s4);max-width:36ch}
.auth-m{display:flex;align-items:center;justify-content:center;padding:var(--s6) var(--s5)}
.auth-box{width:100%;max-width:440px}
.auth-box.wide{max-width:660px}
.auth-box h1{font-size:30px;letter-spacing:-.02em}
.auth-box .sub{color:var(--muted);margin-top:var(--s2)}
.tabs{display:flex;border-bottom:1px solid var(--line);margin:var(--s5) 0}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:var(--s3) var(--s4);font-weight:600;color:var(--muted);cursor:pointer;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--green);border-color:var(--green)}
.alt{margin-top:var(--s4);color:var(--ink2)}
.forgot{margin-top:var(--s3)}
.forgot summary{cursor:pointer;color:var(--green);font-weight:600}
.forgot p{margin-top:var(--s2);color:var(--ink2)}

/* ---------- app chrome ---------- */
.top{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 var(--s5);background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.top-l{display:flex;align-items:center;gap:var(--s2)}
.menu-btn{display:none}
body.admin .top{background:var(--slate);border-color:var(--slate-d);color:#fff}
body.admin .top .brand{color:#fff}
body.admin .top .brand .mk{background:#fff;color:var(--slate)}
body.admin .top .brand-t small{color:#b7c6cf}
body.admin .top :focus-visible{outline-color:#fff}
.um{position:relative}
.um-btn{display:flex;align-items:center;gap:var(--s2);background:none;border:0;cursor:pointer;padding:var(--s1) var(--s2);border-radius:var(--r);font-weight:600}
.um-btn:hover{background:var(--line2)}
body.admin .um-btn:hover{background:#2f4553}
.av{width:34px;height:34px;border-radius:50%;background:var(--accent-l);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:14px}
body.admin .av{background:#fff;color:var(--slate)}
.um-menu{position:absolute;right:0;top:calc(100% + 6px);min-width:250px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--r2);padding:var(--s2);box-shadow:0 8px 24px rgba(20,32,26,.14)}
.um-who{padding:var(--s3);border-bottom:1px solid var(--line2);margin-bottom:var(--s2)}
.um-who strong{display:block}
.um-who span{color:var(--muted);font-size:13.5px}
.um-menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:var(--s3);border-radius:var(--r);cursor:pointer;font-weight:500}
.um-menu button:hover{background:var(--line2)}
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:calc(100vh - 60px)}
.side{background:var(--surface);border-right:1px solid var(--line);padding:var(--s4);position:sticky;top:60px;height:calc(100vh - 60px);overflow:auto;display:flex;flex-direction:column}
.side a.nl{display:flex;align-items:center;gap:var(--s3);padding:10px var(--s3);border-radius:var(--r);color:var(--ink2);text-decoration:none;font-weight:500;margin-bottom:2px}
.side a.nl:hover{background:var(--line2)}
.side a.nl.on{background:var(--accent-l);color:var(--accent);font-weight:700}
.side .ic{flex:none}
.side-note{margin-top:auto;padding:var(--s4) var(--s3) 0;font-size:13.5px;color:var(--muted);border-top:1px solid var(--line2)}
.scrim{position:fixed;inset:60px 0 0 0;background:rgba(20,32,26,.45);z-index:24}
.main{padding:var(--s6) var(--s6) 96px;max-width:1180px;width:100%;outline:0}
.toast{position:fixed;left:50%;bottom:var(--s5);transform:translate(-50%,16px);background:var(--ink);color:#fff;padding:var(--s3) var(--s5);border-radius:var(--r);font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- app content ---------- */
.ph{margin-bottom:var(--s5)}
.ph h1{font-size:28px;letter-spacing:-.02em}
.ph p{color:var(--muted);margin-top:var(--s2);max-width:64ch}
.ph.rowph{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s4);flex-wrap:wrap}
.crumb{margin-bottom:var(--s3)}
.crumb a{color:var(--muted);text-decoration:none;font-weight:500}
.crumb a:hover{color:var(--ink);text-decoration:underline}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:var(--s5);margin-bottom:var(--s5)}
.panel:last-child{margin-bottom:0}
.panel>h2{font-size:17px;margin-bottom:var(--s1)}
.panel>.desc{color:var(--muted);margin-bottom:var(--s4);max-width:62ch}
.cols{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:var(--s5);align-items:start}
.stack>.panel{margin-bottom:var(--s5)}
.stack>.panel:last-child{margin-bottom:0}
.seg5{display:flex;gap:6px;margin:var(--s3) 0 0}
.seg5 i{flex:1;height:6px;border-radius:3px;background:var(--line2)}
.seg5 i.on{background:var(--green)}
.steps{list-style:none;margin-top:var(--s5)}
.step{display:grid;grid-template-columns:32px 1fr;gap:var(--s4);position:relative;padding-bottom:var(--s5)}
.step:last-child{padding-bottom:0}
.step::before{content:"";position:absolute;left:15px;top:34px;bottom:2px;width:2px;background:var(--line)}
.step:last-child::before{display:none}
.mark{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--muted);background:var(--surface);position:relative;z-index:1}
.is-done .mark{background:var(--green);border-color:var(--green);color:#fff}
.is-done::before{background:var(--green)}
.is-current .mark{border-color:var(--accent);color:var(--accent)}
.step h3{font-size:16px;margin:4px 0 2px}
.step p{color:var(--muted);margin-bottom:var(--s3)}
.step .btn{margin-bottom:var(--s1)}
dl.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:var(--s2) var(--s5)}
dl.kv dt{color:var(--muted)}
dl.kv dd{font-weight:600;overflow-wrap:anywhere}
.log{list-style:none}
.log li{padding:var(--s3) 0;border-top:1px solid var(--line2)}
.log li:first-child{border-top:0;padding-top:0}
.log time{display:block;font-size:13px;color:var(--muted)}
.row{display:flex;gap:var(--s3);flex-wrap:wrap;align-items:center}
.or{display:flex;align-items:center;gap:var(--s3);color:var(--muted);margin:var(--s5) 0;font-size:14px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.inline-form{display:flex;gap:var(--s3);align-items:flex-end;flex-wrap:wrap}
.inline-form .field{margin:0;flex:1 1 220px}
fieldset.slots{border:0;margin:var(--s4) 0}
fieldset.slots legend{font-weight:600;margin-bottom:var(--s2);padding:0}
.slot-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s3)}
.slot{position:relative;display:flex;justify-content:space-between;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;background:#fff}
.slot:hover{border-color:var(--ink2)}
.slot input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.slot b{font-size:16px}
.slot span{font-size:13.5px;color:var(--muted)}
.slot.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-l)}
.slot.sel span{color:var(--ink2)}
.slot.full{opacity:.5;cursor:not-allowed}
.slot.full input{cursor:not-allowed}
.slot:focus-within{outline:2px solid var(--accent);outline-offset:2px}

/* appointment pass */
.pass{display:grid;grid-template-columns:minmax(0,1fr) 220px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);margin-bottom:var(--s5);position:relative}
.pass-main{padding:var(--s5)}
.pass-main h2{font-size:17px;margin-bottom:var(--s4)}
.pass-qr{border-left:2px dashed var(--line);padding:var(--s5);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s3);text-align:center}
.pass-qr svg{width:150px;height:150px}
.pass-qr b{font-size:16px;letter-spacing:.02em}
.pass::before,.pass::after{content:"";position:absolute;right:199px;width:22px;height:22px;border-radius:50%;background:var(--paper);border:1px solid var(--line)}
.pass::before{top:-12px;border-top-color:transparent;border-left-color:transparent;transform:rotate(45deg)}
.pass::after{bottom:-12px;border-bottom-color:transparent;border-right-color:transparent;transform:rotate(45deg)}

/* confirmation slip */
.slip{max-width:760px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:var(--s6)}
.slip-h{display:flex;justify-content:space-between;align-items:center;gap:var(--s4);padding-bottom:var(--s5);border-bottom:2px solid var(--ink);margin-bottom:var(--s5)}
.slip-h h2{font-size:24px}
.slip dl.kv{grid-template-columns:200px minmax(0,1fr);gap:var(--s3) var(--s5)}
.slip-f{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--s5);margin-top:var(--s6);padding-top:var(--s5);border-top:1px solid var(--line)}
.slip-f svg{width:96px;height:96px}

/* admin */
.figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);margin-bottom:var(--s5)}
.fig{padding:var(--s5);border-left:1px solid var(--line)}
.fig:first-child{border-left:0}
.fig b{display:block;font-size:32px;line-height:1;font-weight:700;letter-spacing:-.02em}
.fig span{display:block;color:var(--muted);margin-top:var(--s2)}
.toolbar{display:flex;gap:var(--s3);flex-wrap:wrap;margin-bottom:var(--s4)}
.toolbar .field{margin:0}
.toolbar .field.grow{flex:1 1 260px}
.toolbar .field select{min-width:200px}
.dept{padding:var(--s4) 0;border-top:1px solid var(--line2)}
.dept:first-of-type{border-top:0;padding-top:0}
.dept-h{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s3)}
.dept-h h3{font-size:16px}
.dept-h p{color:var(--muted);font-size:14px}
.remark{margin:var(--s2) 0 0;font-size:14px;color:var(--ink2)}
.dept-act{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s3)}
.dept-act input{flex:1 1 200px;height:36px;padding:0 var(--s3);border:1px solid #aeb9b2;border-radius:var(--r);background:#fff;min-width:0}
.dept-act input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.queue{list-style:none}
.queue li{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);padding:var(--s3) 0;border-top:1px solid var(--line2)}
.queue li:first-child{border-top:0;padding-top:0}
.queue a{font-weight:600;text-decoration:none;color:var(--ink)}
.queue a:hover{text-decoration:underline}
.dtabs{display:flex;gap:var(--s1);flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:var(--s4)}
.dtabs a{padding:var(--s3) var(--s4);text-decoration:none;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1px}
.dtabs a.on{color:var(--accent);border-color:var(--accent)}
.dtabs a:hover{color:var(--ink)}
.desk-sec{padding:var(--s4) 0;border-top:1px solid var(--line2)}
.desk-sec:first-of-type{border-top:0;padding-top:0;margin-top:var(--s4)}
.desk-sec h3{font-size:15px;margin-bottom:var(--s2)}
.desk-sec .field{margin:var(--s3) 0}

/* ---------- small screens ---------- */
@media (max-width:980px){
 .hero{grid-template-columns:1fr;gap:var(--s6);padding-top:var(--s7);padding-bottom:var(--s7)}
 .two{grid-template-columns:1fr;gap:var(--s5)}
 .two .intro{position:static}
 .cols{grid-template-columns:1fr}
 .sec{padding-top:var(--s7);padding-bottom:var(--s7)}
}
@media (max-width:900px){
 .shell{grid-template-columns:minmax(0,1fr)}
 .menu-btn{display:inline-grid}
 .side{position:fixed;top:60px;left:0;bottom:0;height:auto;width:272px;z-index:26;transform:translateX(-100%);transition:transform .2s;box-shadow:0 8px 24px rgba(20,32,26,.2)}
 .side.open{transform:none}
 body.admin .menu-btn{color:#fff}
 .main{padding:var(--s5) var(--s4) 96px}
 .auth{grid-template-columns:1fr}
 .auth-a{padding:var(--s4) var(--s5);flex-direction:row;align-items:center}
 .auth-a .auth-b{display:none}
 .auth-m{align-items:flex-start;padding-top:var(--s6)}
}
@media (max-width:700px){
 .wrap{padding:0 var(--s4)}
 .sh-nav{display:none}
 .sh-in{height:64px}
 .hero-k dl>div{grid-template-columns:1fr;gap:2px}
 .how li{grid-template-columns:40px 1fr}
 .how li::before{font-size:24px}
 .grid2{grid-template-columns:1fr}
 .figs{grid-template-columns:repeat(2,minmax(0,1fr))}
 .fig:nth-child(3){border-left:0}
 .fig:nth-child(n+3){border-top:1px solid var(--line)}
 .slot-list{grid-template-columns:1fr}
 .pass{grid-template-columns:1fr}
 .pass-qr{border-left:0;border-top:2px dashed var(--line)}
 .pass::before,.pass::after{display:none}
 .foot-in{grid-template-columns:1fr}
 .um-n{display:none}
 .hide-sm{display:none}
 .slip{padding:var(--s4)}
 .slip dl.kv{grid-template-columns:1fr;gap:2px}
 .slip dl.kv dd{margin-bottom:var(--s3)}
 .ph h1{font-size:24px}
 .panel{padding:var(--s4)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

@media print{
 body{background:#fff}
 .top,.side,.scrim,.toast,.no-print{display:none!important}
 .shell{display:block}
 .main{padding:0;max-width:none}
 .slip,.pass,.panel{border-color:#999;break-inside:avoid}
}

/* ---------- small helpers ---------- */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {

    var v = s.clear[d.key];
    return '<div class="dept"><div class="dept-h"><div><h3>' + esc(d.key) + '</h3><p>' + esc(d.needs) + '</p></div>' + clearTag(v) + '</div>' +
      (s.remarks[d.key] ? '<p class="remark"><b>Note:</b> ' + esc(s.remarks[d.key]) + '</p>' : '') +
      '<div class="dept-act" data-id="' + s.id + '" data-dept="' + esc(d.key) + '"><input type="text" placeholder="Note to student" aria-label="Note for ' + esc(d.key) + '">' +
      '<button class="btn btn-primary btn-sm" type="button" data-act="approve">Approve</button><button class="btn btn-danger btn-sm" type="button" data-act="return">Return</button></div></div>';
  }
  function record(id) {
    var s = A.student(id);
    if (!s) return '<header class="ph"><h1>Student not found</h1><p><a href="#/students">Back to all students</a></p></header>';
    var rd = A.ready(s), n = A.clearedCount(s);
    var log = s.log.slice(0, 8).map(function (l) { return '<li>' + esc(l.x) + '<time>' + A.fmtStamp(l.t) + '</time></li>'; }).join('');
    var gate = s.approved ? 'Registration approved. The student can print the confirmation.' :
      rd ? 'Every requirement is complete.' :
      'Approval unlocks after all four clearances, check-in and document verification.';
    return '<p class="crumb"><a href="#/students">All students</a></p>' +
      '<header class="ph rowph"><div><h1>' + esc(s.name) + '</h1><p>' + esc(s.regNo) + ', ' + esc(s.programme) + '</p></div>' + stageTag(s) + '</header>' +
      '<div class="cols"><div class="stack"><section class="panel"><h2>Department clearances</h2><p class="desc">' + n + ' of 4 approved. A returned clearance needs a note.</p>' + A.DEPTS.map(function (d) { return deptBlock(s, d); }).join('') + '</section>' +
      '<section class="panel"><h2>Student details</h2><dl class="kv" style="margin-top:12px"><dt>Email</dt><dd>' + esc(s.email) + '</dd><dt>Phone</dt><dd>' + esc(s.phone) + '</dd><dt>Faculty</dt><dd>' + esc(s.faculty) + '</dd><dt>Location check</dt><dd>' + (s.loc ? s.loc.km + ' km, ' + esc(s.loc.label) : 'Not done') + '</dd></dl></section></div>' +
      '<div class="stack"><section class="panel"><h2>Registry desk</h2>' +
      '<div class="desk-sec"><h3>Appointment</h3>' + (s.appointment ? '<dl class="kv"><dt>When</dt><dd>' + esc(apptText(s)) + '</dd><dt>Reference</dt><dd>' + s.appointment.ref + '</dd></dl>' : '<p class="muted">No appointment booked.</p>') + '</div>' +
      '<div class="desk-sec"><h3>Check-in</h3>' + (s.checkedIn ? tag('ok', 'Checked in') : '<p class="muted" style="margin-bottom:12px">' + (s.appointment ? 'Student has not arrived yet.' : 'Needs an appointment first.') + '</p><button class="btn btn-line btn-sm" type="button" data-act="checkin" data-id="' + s.id + '"' + (s.appointment ? '' : ' disabled') + '>Check in student</button>') + '</div>' +
      '<div class="desk-sec"><h3>Document verification</h3>' + (s.verified ? tag('ok', 'Verified') + '<p class="remark">' + esc(s.verifyNote) + '</p>' :
        '<div class="field"><label for="vn">Registrar note</label><input id="vn" type="text" value="Original documents inspected and details matched."></div><button class="btn btn-line btn-sm" type="button" data-act="verify" data-id="' + s.id + '"' + (s.checkedIn ? '' : ' disabled') + '>Record verification</button>' + (s.checkedIn ? '' : '<p class="muted" style="margin-top:8px">Check the student in first.</p>')) + '</div>' +
      '<div class="desk-sec"><h3>Final approval</h3><p class="muted" style="margin-bottom:12px">' + gate + '</p>' +
      '<button class="btn btn-primary" type="button" data-act="final" data-id="' + s.id + '"' + (rd ? '' : ' disabled') + '>' + (s.approved ? 'Approved' : 'Approve registration') + '</button></div></section>' +
      '<section class="panel"><h2>Activity</h2><ul class="log" style="margin-top:12px">' + log + '</ul></section></div></div>';
  }

  /* ---------- clearances queue ---------- */
  function clearances(p) {
    var key = p[0] ? decodeURIComponent(p[0]) : A.DEPTS[0].key;
    var d = A.DEPTS.filter(function (x) { return x.key === key; })[0] || A.DEPTS[0];
    var order = { pending: 0, rejected: 1, approved: 2 };
    var list = all().slice().sort(function (a, b) { return order[a.clear[d.key]] - order[b.clear[d.key]]; });
    var tabs = A.DEPTS.map(function (x) {
      var n = all().filter(function (s) { return s.clear[x.key] === 'pending'; }).length;
      return '<a href="#/clearances/' + encodeURIComponent(x.key) + '"' + (x.key === d.key ? ' class="on" aria-current="page"' : '') + '>' + esc(x.key) + (n ? ' (' + n + ')' : '') + '</a>';
    }).join('');
    var rows = list.map(function (s) {
      return '<tr><td><a class="who" href="#/students/' + s.id + '">' + esc(s.name) + '</a><span class="sub">' + esc(s.regNo) + '</span></td><td>' + clearTag(s.clear[d.key]) + (s.remarks[d.key] ? '<span class="sub">' + esc(s.remarks[d.key]) + '</span>' : '') + '</td>' +
        '<td><div class="dept-act" style="margin:0" data-id="' + s.id + '" data-dept="' + esc(d.key) + '"><input type="text" placeholder="Note to student" aria-label="Note for ' + esc(s.name) + '"><button class="btn btn-primary btn-sm" type="button" data-act="approve">Approve</button><button class="btn btn-danger btn-sm" type="button" data-act="return">Return</button></div></td></tr>';
    }).join('');
    return '<header class="ph"><h1>Clearances</h1><p>' + esc(d.needs) + ' Approve each file, or return it with a note.</p></header>' +
      '<section class="panel"><nav class="dtabs" aria-label="Departments">' + tabs + '</nav><div class="scroll"><table class="tbl" style="min-width:720px"><thead><tr><th>Student</th><th>' + esc(d.key) + ' status</th><th>Decision</th></tr></thead><tbody>' + rows + '</tbody></table></div></section>';
  }

  /* ---------- appointments ---------- */
  function appointments() {
    var list = all().filter(function (s) { return s.appointment; }).sort(function (a, b) {
      var ka = a.appointment.date + A.SLOTS.indexOf(a.appointment.time), kb = b.appointment.date + A.SLOTS.indexOf(b.appointment.time);
      return ka < kb ? -1 : ka > kb ? 1 : 0;
    });
    var dates = []; list.forEach(function (s) { if (dates.indexOf(s.appointment.date) < 0) dates.push(s.appointment.date); });
    var shown = apptDate ? list.filter(function (s) { return s.appointment.date === apptDate; }) : list;
    var rows = shown.length ? shown.map(function (s) {
      var a = s.appointment;
      var status = s.approved ? tag('ok', 'Registered') : s.verified ? tag('ok', 'Verified') : s.checkedIn ? tag('go', 'Checked in') : tag('wait', 'Booked');
      return '<tr><td><b>' + a.time + '</b><span class="sub">' + A.fmtDate(a.date, true) + '</span></td><td><a class="who" href="#/students/' + s.id + '">' + esc(s.name) + '</a><span class="sub">' + esc(s.regNo) + '</span></td><td class="hide-sm">' + a.ref + '</td><td>' + status + '</td><td>' +
        (s.checkedIn ? '' : '<button class="btn btn-line btn-sm" type="button" data-act="checkin" data-id="' + s.id + '">Check in</button>') + '</td></tr>';
    }).join('') : '<tr><td colspan="5" class="empty">No appointments booked for this date.</td></tr>';
    return '<header class="ph"><h1>Appointments</h1><p>Check students in at the registry desk. Scanning a pass types its reference into the box below.</p></header>' +
      '<section class="panel"><form class="inline-form" data-form="scan"><div class="field"><label for="ref">Pass reference</label><input id="ref" name="ref" placeholder="SUR-2026-0000" autocomplete="off"></div><button class="btn btn-primary" type="submit">Check in</button></form></section>' +
      '<section class="panel"><div class="toolbar"><div class="field"><label for="ad">Date</label><select id="ad"><option value="">All dates</option>' + dates.map(function (d) { return '<option value="' + d + '"' + (d === apptDate ? ' selected' : '') + '>' + A.fmtDate(d) + '</option>'; }).join('') + '</select></div></div>' +
      '<div class="scroll"><table class="tbl"><thead><tr><th>Time</th><th>Student</th><th class="hide-sm">Reference</th><th>Status</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div></section>';
  }

  /* ---------- settings ---------- */
  function settings() {
    var s = A.D().settings;
    return '<header class="ph"><h1>Settings</h1><p>These rules apply to every student booking from now on.</p></header>' +
      '<section class="panel" style="max-width:640px"><form data-form="settings" novalidate>' +
      '<div class="grid2"><div class="field"><label for="st-o">Registration opens</label><input id="st-o" name="opens" type="date" value="' + s.opens + '"></div>' +
      '<div class="field"><label for="st-c">Registration closes</label><input id="st-c" name="closes" type="date" value="' + s.closes + '"></div>' +
      '<div class="field"><label for="st-cap">Places per time slot</label><input id="st-cap" name="capacity" type="number" min="1" max="200" value="' + s.capacity + '"></div>' +
      '<div class="field"><label for="st-g">Late arrival allowance (minutes)</label><input id="st-g" name="grace" type="number" min="0" max="120" value="' + s.grace + '"></div>' +
      '<div class="field"><label for="st-r">Booking radius (km)</label><input id="st-r" name="radius" type="number" min="1" max="50" step="0.5" value="' + s.radius + '"></div></div>' +
      '<p class="err-line" id="st-err" role="alert"></p><button class="btn btn-primary" type="submit">Save settings</button></form></section>';
  }

  var rerender = A.router({ overview: overview, students: students, clearances: clearances, appointments: appointments, settings: settings }, 'overview');
  A.onChange = function () {
    var ae = document.activeElement;
    if (ae && /INPUT|SELECT|TEXTAREA/.test(ae.tagName)) return;
    rerender();
  };

  /* ---------- actions ---------- */
  function decide(box, kind) {
    var s = A.student(box.dataset.id), dept = box.dataset.dept, note = box.querySelector('input').value.trim();
    if (kind === 'return' && !note) { A.toast('Add a note so the student knows what to fix.'); box.querySelector('input').focus(); return; }
    if (kind === 'approve') { s.clear[dept] = 'approved'; delete s.remarks[dept]; A.log(s, dept + ' clearance approved'); }
    else { s.clear[dept] = 'rejected'; s.remarks[dept] = note; A.log(s, dept + ' returned your clearance with a note'); }
    A.save(); rerender();
    A.toast(dept + (kind === 'approve' ? ' clearance approved for ' : ' clearance returned for ') + A.first(s.name) + '.');
  }
  function checkIn(s) {
    if (!s.appointment) { A.toast('That student has no appointment.'); return; }
    s.checkedIn = true; A.log(s, 'Checked in at the registry desk'); A.save(); rerender();
    A.toast(A.first(s.name) + ' is checked in.');
  }

  view.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b) return;
    var a = b.dataset.act;
    if (a === 'approve' || a === 'return') return decide(b.closest('.dept-act'), a);
    var s = A.student(b.dataset.id);
    if (!s) return;
    if (a === 'checkin') checkIn(s);
    else if (a === 'verify') {
      if (!s.checkedIn) return;
      var note = (A.$('vn') && A.$('vn').value.trim()) || 'Original documents inspected and verified.';
      s.verified = true; s.verifyNote = note; A.log(s, 'Documents verified by the registrar'); A.save(); rerender();
      A.toast('Verification recorded for ' + A.first(s.name) + '.');
    } else if (a === 'final') {
      if (!A.ready(s)) return;
      s.approved = true; A.log(s, 'Registration approved'); A.save(); rerender();
      A.toast('Registration approved for ' + A.first(s.name) + '.');
    }
  });
  view.addEventListener('input', function (e) {
    if (e.target.id === 'q') { q = e.target.value; A.$('rows').innerHTML = studentRows(); }
  });
  view.addEventListener('change', function (e) {
    if (e.target.id === 'sf') { stageFilter = e.target.value; A.$('rows').innerHTML = studentRows(); }
    if (e.target.id === 'ad') { apptDate = e.target.value; rerender(); }
  });
  view.addEventListener('submit', function (e) {
    var f = e.target.closest('form[data-form]');
    if (!f) return;
    e.preventDefault();
    if (f.dataset.form === 'scan') {
      var ref = f.elements.ref.value.trim().toUpperCase();
      var s = all().filter(function (x) { return x.appointment && x.appointment.ref === ref; })[0];
      if (!s) { A.toast('No appointment has the reference ' + (ref || 'you entered') + '.'); return; }
      if (s.checkedIn) { A.toast(A.first(s.name) + ' is already checked in.'); return; }
      checkIn(s);
    } else if (f.dataset.form === 'settings') {
      var v = f.elements, err = A.$('st-err');
      var cap = parseInt(v.capacity.value, 10), gr = parseInt(v.grace.value, 10), rad = parseFloat(v.radius.value);
      if (!v.opens.value || !v.closes.value || v.closes.value < v.opens.value) { err.textContent = 'The closing date must be on or after the opening date.'; return; }
      if (!(cap >= 1) || !(gr >= 0) || !(rad > 0)) { err.textContent = 'Enter a whole number of places, a late allowance of zero or more, and a radius above zero.'; return; }
      var st = A.D().settings;
      st.opens = v.opens.value; st.closes = v.closes.value; st.capacity = cap; st.grace = gr; st.radius = rad;
      A.save(); err.textContent = ''; A.toast('Settings saved.');
    }
  });
})();
</script>
</body>
</html>
